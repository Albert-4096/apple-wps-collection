# Snowball Wi-Fi access-point collector.
#
#   docker compose up -d --build      # build image and start (detached)
#   docker compose logs -f            # follow the stats output
#   docker compose down               # stop (the ./data DB is kept)
#
# The SQLite database is bind-mounted from ./data so it survives restarts and
# is easy to back up. Seed it by placing your snowball.db at ./data/snowball.db
# before the first `up`; otherwise the crawler starts empty and self-seeds.

services:
  snowball:
    build:
      context: .
      dockerfile: cmd/snowball/Dockerfile
    image: snowball
    container_name: snowball
    restart: unless-stopped
    # Run as the host user so the bind-mounted ./data is writable and the DB
    # files stay owned by you. Change if your uid:gid differs from 1000:1000.
    user: "1000:1000"
    # Inside the container bind the dashboard on all interfaces; on the host it
    # is published to localhost only (see ports below). Set SNOWBALL_TOKEN and
    # add `-token ${SNOWBALL_TOKEN}` to expose it more widely.
    command: ["-db", "/data/snowball.db", "-listen", ":1648"]
    volumes:
      - ./snowball.db:/data/snowball.db
    # Host resource caps so the crawler is a good neighbour. The workload is
    # network-I/O-bound, so CPU is mostly a guardrail; tune to taste.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
    networks: [internal]

  nginx:
    image: nginx:alpine
    ports:
      - "16492:16492"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [snowball]
    networks: [internal]

networks:
  internal:
